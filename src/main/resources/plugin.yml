name: DialogMenu
version: ${version}
main: dev.dialogmenu.DialogMenuPlugin
api-version: '1.21.7'
softdepend: [Skript, PlaceholderAPI, CraftEngine]
commands:
  dialogmenu:
    description: YAML Dialog menu
    usage: /dialogmenu open <id>
    permission: dialogmenu.use
permissions:
  dialogmenu.admin:
    default: op
    description: Manage Dialog menus and resources
  dialogmenu.use:
    default: true
    description: Open Dialog menus
