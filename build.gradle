plugins {
    id 'java'
}

group = 'dev.dialogmenu'
version = providers.gradleProperty('version').get()

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://repo.skriptlang.org/releases' }
}

def localClasspath = System.getenv('DIALOGMENU_LOCAL_CLASSPATH')
dependencies {
    if (localClasspath) {
        compileOnly files(localClasspath.split(java.io.File.pathSeparator).collect { file(it) })
    } else {
        compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
        compileOnly('com.github.SkriptLang:Skript:2.16.2') {
            transitive = false
        }
    }
    testImplementation files(configurations.compileClasspath)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveFileName = "DialogMenu-rgba-${project.version}.jar"
}

// Keep behavioral regressions part of the standard build without a test-framework dependency.
tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.dialogmenu.RegressionTests'
    args layout.projectDirectory.asFile.absolutePath
    jvmArgs '-Djava.awt.headless=true'
}
tasks.register('bindingTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.dialogmenu.BindingTests'
    jvmArgs '-Djava.awt.headless=true'
}

tasks.named('check') {
    dependsOn tasks.named('regressionTest')
    dependsOn tasks.named('bindingTest')
}

def artifact = tasks.named('jar')
tasks.register('rgbaEditionTest', JavaExec) {
    dependsOn testClasses, artifact
    classpath = files(sourceSets.test.output.classesDirs, artifact.flatMap { it.archiveFile },
        configurations.testRuntimeClasspath)
    mainClass = 'dev.dialogmenu.EditionTests'
    args 'rgba', layout.buildDirectory.dir('edition-checks/rgba').get().asFile.absolutePath
    jvmArgs '-Djava.awt.headless=true', '-Ddialogmenu.rgba=false'
}
tasks.named('check') { dependsOn tasks.named('rgbaEditionTest') }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// The executable suite above is the test runner; no JUnit/TestNG engine is required.
tasks.named('test') {
    dependsOn tasks.named('regressionTest')
    dependsOn tasks.named('bindingTest')
    enabled = false
}
