plugins {
    id 'java'
}

group = 'dev.dialogmenu'
version = providers.gradleProperty('version').get()

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://repo.skriptlang.org/releases' }
}

def localClasspath = System.getenv('DIALOGMENU_LOCAL_CLASSPATH')
dependencies {
    if (localClasspath) {
        compileOnly files(localClasspath.split(java.io.File.pathSeparator).collect { file(it) })
    } else {
        compileOnly 'io.papermc.paper:paper-api:1.21.7-R0.1-SNAPSHOT'
        compileOnly 'net.kyori:adventure-nbt:4.24.0'
        compileOnly('com.github.SkriptLang:Skript:2.12.2') {
            transitive = false
        }
    }
    testImplementation files(configurations.compileClasspath)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(providers.gradleProperty('javaVersion').getOrElse('21').toInteger())
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property('version', project.version)
    from('tools/models') {
        into 'models/compiler'
        exclude '**/__pycache__/**', '**/test_*.py'
    }
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveFileName = "DialogMenu-${project.version}.jar"
    from('LICENSE') {
        into 'META-INF'
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.dialogmenu.ResourceRegressionTests'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'dialogmenu.test.directory', layout.buildDirectory.dir('regression-data').get().asFile.absolutePath
}
check.dependsOn regressionTest
// 回归入口为上面的JavaExec，无需为main式检查引入测试框架。
test.failOnNoDiscoveredTests = false
