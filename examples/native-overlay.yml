      amount-cover: {type: rectangle, width: 320, height: 10, color: '#223F55', offset: {x: 226, y: 172, z: 1}}
      send-cover: {type: rectangle, width: 320, height: 10, color: '#223F55', offset: {x: 226, y: 202, z: 1}}
