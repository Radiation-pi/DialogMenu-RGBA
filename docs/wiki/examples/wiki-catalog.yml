schema-version: 1
id: wiki-catalog
variables:
  selected:
    type: external
    source: selected-id
    fallback: none
    preview: none
collections:
  entries: {external: true}
forms:
  create:
    title: 新建条目
    submit: 提交
    cancel: 取消
    fields:
      name: {label: 名称, initial: '', max-length: 24}
pages:
  wiki-catalog-list:
    canvas: {width: 300, height: 120}
    frontend:
      title:
        type: text
        content: '选中：{selected}'
        color: '#243247'
        offset: {y: 30}
      create:
        type: text
        content: 新建
        color: '#243247'
        actions: 'callback: create'
      close:
        type: text
        content: 关闭
        color: '#243247'
        offset: {y: -35}
        actions: close
    flow-lists:
      content:
        collection: entries
        title: 条目
        row: '{entry.name} · {entry.size}'
        empty: 暂无条目
