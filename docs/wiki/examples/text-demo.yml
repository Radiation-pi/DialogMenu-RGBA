schema-version: 1
id: text-demo
canvas: {width: 300, height: 180}
frontend:
  paragraph:
    type: text
    content: '这是一段独立文字，超过设置的行宽后换行。'
    size: 8
    color: '#243247'
    alignment: left
    line-width: 200
    max-lines: 4
    offset: {x: -100, y: 38}
  close:
    type: text
    content: 关闭
    color: '#243247'
    offset: {y: -60}
    actions: close
