schema-version: 1
id: wiki-pages
pages:
  wiki-page-one:
    canvas: {width: 300, height: 180}
    frontend:
      body:
        type: text
        content: 第一页正文
        color: '#243247'
        offset: {y: 30}
      next:
        type: text
        content: 下一页
        color: '#243247'
        actions: 'open: wiki-page-two'
      close:
        type: text
        content: 关闭
        color: '#243247'
        offset: {y: -60}
        actions: close
  wiki-page-two:
    canvas: {width: 300, height: 180}
    frontend:
      body:
        type: text
        content: 第二页正文
        color: '#243247'
        offset: {y: 30}
      previous:
        type: text
        content: 上一页
        color: '#243247'
        actions: back
      close:
        type: text
        content: 关闭
        color: '#243247'
        offset: {y: -60}
        actions: close
