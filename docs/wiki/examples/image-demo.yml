schema-version: 1
id: image-demo
canvas: {width: 300, height: 180}
frontend:
  panel:
    type: image
    source: demo-panel.png
    width: 143
    height: 37
    offset: {y: 12}
    tooltip: 同一源图，独立宽高
    actions: 'tell: 点击了拉伸图片'
  label:
    type: text
    content: 图片独立拉伸
    color: '#243247'
    offset: {y: -30, z: 1}
  close:
    type: text
    content: 关闭
    color: '#243247'
    offset: {y: -65}
    actions: close
